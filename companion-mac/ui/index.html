<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="__CSRF_TOKEN__">
  <title>SmartDeck</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="frame">
    <div class="elbow top"></div>
    <header id="topbar">
      <div class="brand">SmartDeck <span class="sub">Control Interface</span></div>
      <div id="conn" class="conn off"><span class="dot"></span><span id="connText">Connecting…</span></div>
      <div class="spacer"></div>
      <select id="themeSel" title="Colour scheme" aria-label="Colour scheme">
        <option value="tng">TNG</option><option value="voyager">Voyager</option><option value="picard">Picard</option>
      </select>
      <button id="soundBtn" class="ghost" title="Interface sounds">Sound: on</button>
      <button id="logBtn" class="ghost">Log</button>
      <button id="settingsBtn" class="ghost">Settings</button>
      <button id="syncBtn">Sync to deck</button>
      <button id="saveBtn" class="primary" disabled>Save</button>
    </header>

    <aside id="rail" aria-hidden="true">
      <div class="seg c-peach"><span>03</span></div>
      <div class="seg c-violet tall"><span>47</span></div>
      <div class="seg c-blue"><span>812</span></div>
      <div class="seg c-salmon"><span>06</span></div>
      <div class="seg c-lilac grow"></div>
    </aside>

    <main>
      <section id="editorView">
        <nav id="tabs"></nav>
        <div class="workspace">
          <div id="gridWrap"><div id="grid"></div><p class="hint">Click a cell to edit · drag to move/swap buttons</p></div>
          <aside id="panel"></aside>
        </div>
      </section>
      <section id="settingsView" hidden></section>
    </main>

    <div class="elbow bottom"></div>
    <footer id="foot"><span id="stardate">STARDATE</span><span class="spacer"></span><span>SmartDeck · Deck Control</span></footer>
  </div>

  <div id="toast" role="status"></div>
  <aside id="logDrawer" hidden><h3>Activity log</h3><pre id="logText"></pre></aside>
  <script src="/lcars.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
